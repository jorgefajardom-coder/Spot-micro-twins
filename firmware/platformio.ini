; Compilar:  pio run          Subir:  pio run -t upload       Monitor:  pio device monitor
[platformio]
src_dir = spotmicro_esp32

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SPOT_DEBUG=0
lib_deps =
  gilmaimon/ArduinoWebsockets@^0.5.4
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2

; Igual pero con logs por paquete en el monitor serie
[env:esp32dev-debug]
extends = env:esp32dev
build_flags =
  -D SPOT_DEBUG=1
