name: wiki

# Publica docs/wiki/ en la pestaña Wiki de GitHub cada vez que cambia en main.
# Requisito único: activar Wiki en Settings → Features y crear una primera
# página desde la web (GitHub no crea el repositorio .wiki.git hasta entonces).

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/scripts/build_wiki.py", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: wiki

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clonar la wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-out
      - name: Generar páginas
        run: python .github/scripts/build_wiki.py wiki-out --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
      - name: Publicar
        working-directory: wiki-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Sincroniza la wiki desde ${GITHUB_SHA::7}"
          git push
